<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khảo Thí Trắc Nghiệm Trực Tuyến - Azota Pro</title>

  <!-- Tailwind CSS & React 18 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase & Excel -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <!-- Mammoth (.docx parser & Image extractor) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <!-- PDF.js (PDF Text & Image extractor) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- Tesseract.js (Client-side OCR tiếng Việt cho PDF scan/Ảnh) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .img-zoom { transition: transform 0.2s ease-in-out; }
    .img-zoom:hover { transform: scale(1.02); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. CẤU HÌNH SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://jzlevapweqnoxxctjfri.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8jOMTGpl9BsMRzKcmAu9Zw_zS2TGfb8";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. PARSER & OCR CORE ENGINE
    // ==========================================
    
    // Tách văn bản thô / HTML sang cấu trúc Phần I & Phần II
    function parseExamContent(rawHtmlOrText) {
      const container = document.createElement('div');
      container.innerHTML = rawHtmlOrText;

      const questions = [];
      let currentPart = 'part1';
      let currentQ = null;
      let counter = 1;

      // Chuẩn hóa dòng text
      const nodes = Array.from(container.childNodes);
      
      const part1Regex = /(Phần\s+I|PHẦN\s+1|Trắc\s+nghiệm\s+nhiều\s+lựa\s+chọn)/i;
      const part2Regex = /(Phần\s+II|PHẦN\s+2|Đúng\s*\/\s*Sai|Trắc\s+nghiệm\s+đúng\s+sai)/i;
      
      const qStartRegex = /^(Câu\s*\d+[\s:.]|\d+[\s:.])/i;
      const optPart1Regex = /^([*]?[A-D])[\s:.)\]]/i;
      const optPart2Regex = /^([*]?[a-d])[\s:.)\]]/i;

      function flushCurrentQ() {
        if (currentQ && currentQ.content) {
          questions.push({ ...currentQ, order_index: counter++ });
        }
        currentQ = null;
      }

      for (let node of nodes) {
        let text = node.textContent ? node.textContent.trim() : '';
        let html = node.innerHTML || '';

        if (!text && node.nodeName !== 'IMG') continue;

        // Phát hiện chuyển phần
        if (part2Regex.test(text)) {
          flushCurrentQ();
          currentPart = 'part2';
          continue;
        } else if (part1Regex.test(text)) {
          flushCurrentQ();
          currentPart = 'part1';
          continue;
        }

        // Bắt đầu câu hỏi mới
        if (qStartRegex.test(text)) {
          flushCurrentQ();
          const cleanText = text.replace(qStartRegex, '').trim();
          currentQ = {
            id: 'q_' + Math.random().toString(36).substring(2, 9),
            part: currentPart,
            type: currentPart === 'part1' ? 'single' : 'multi_tf',
            content: cleanText,
            images: [],
            options: [],
            explanation: ''
          };

          // Nhặt ảnh nằm ngay trong thẻ câu hỏi
          if (node.querySelectorAll) {
            node.querySelectorAll('img').forEach(img => {
              if (img.src) currentQ.images.push(img.src);
            });
          }
          continue;
        }

        // Nếu là thẻ IMG đứng riêng rẽ
        if (node.nodeName === 'IMG' && currentQ) {
          if (node.src) currentQ.images.push(node.src);
          continue;
        }

        // Nếu đang trong câu hỏi
        if (currentQ) {
          // Bóc tách Lời giải
          if (/^(Lời giải|Hướng dẫn giải|Giải thích):/i.test(text)) {
            currentQ.explanation = text.replace(/^(Lời giải|Hướng dẫn giải|Giải thích):/i, '').trim();
            continue;
          }

          // Phương án Phần I (A, B, C, D)
          if (currentQ.part === 'part1' && optPart1Regex.test(text)) {
            const match = text.match(optPart1Regex);
            let label = match[1].toUpperCase().replace('*', '');
            
            // Nhận diện đáp án đúng bằng dấu *, chữ in đậm hoặc style màu đỏ
            const isBold = /<b>|<strong>/i.test(html) || text.startsWith('*') || text.includes('[ĐÚNG]');
            const isRed = /color:\s*(red|#f00|#ff0000)/i.test(html);
            const isCorrect = isBold || isRed;

            const cleanContent = text.replace(optPart1Regex, '').replace(/\[ĐÚNG\]|\[x\]/gi, '').trim();
            currentQ.options.push({
              id: 'opt_' + Math.random().toString(36).substring(2, 8),
              label: label,
              content: cleanContent,
              is_correct: isCorrect
            });
            continue;
          }

          // Phương án Phần II (a, b, c, d Đúng/Sai)
          if (currentQ.part === 'part2' && optPart2Regex.test(text)) {
            const match = text.match(optPart2Regex);
            let label = match[1].toLowerCase().replace('*', '');
            
            // Mặc định kiểm tra chữ [Đ] hoặc [S], chữ in đậm
            let correctValue = true; // Mặc định Đúng nếu đánh dấu
            if (text.includes('[S]') || text.includes('[SAI]') || text.toLowerCase().includes('sai')) {
              correctValue = false;
            }

            const cleanContent = text.replace(optPart2Regex, '').replace(/\[ĐÚNG\]|\[SAI\]|\[Đ\]|\[S\]/gi, '').trim();
            currentQ.options.push({
              id: 'opt_' + Math.random().toString(36).substring(2, 8),
              label: label,
              content: cleanContent,
              is_correct: correctValue
            });
            continue;
          }

          // Đoạn văn bổ sung hoặc có ảnh lồng bên trong
          if (node.querySelectorAll) {
            node.querySelectorAll('img').forEach(img => {
              if (img.src) currentQ.images.push(img.src);
            });
          }
          if (currentQ.options.length === 0) {
            currentQ.content += ' ' + text;
          }
        }
      }

      flushCurrentQ();

      // Đảm bảo phần II luôn đủ 4 ý a, b, c, d
      questions.forEach(q => {
        if (q.part === 'part2' && q.options.length === 0) {
          ['a', 'b', 'c', 'd'].forEach(lbl => {
            q.options.push({
              id: 'opt_' + Math.random().toString(36).substring(2, 8),
              label: lbl,
              content: `Ý ${lbl} khẳng định...`,
              is_correct: true
            });
          });
        }
      });

      return questions;
    }

    // ==========================================
    // 3. MAIN APPLICATION ROUTER
    // ==========================================
    function App() {
      const [view, setView] = useState('dashboard');
      const [quizCode, setQuizCode] = useState('');

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('q');
        if (code) {
          setQuizCode(code);
          setView('take');
        }
      }, []);

      const navigate = (newView, code = '') => {
        if (newView === 'take') {
          window.history.pushState({}, '', `?q=${code}`);
          setQuizCode(code);
        } else {
          window.history.pushState({}, '', window.location.pathname);
        }
        setView(newView);
      };

      return (
        <div>
          {view === 'dashboard' && <DashboardView onCreate={() => navigate('create')} onTake={(c) => navigate('take', c)} />}
          {view === 'create' && <QuizCreatorView onBack={() => navigate('dashboard')} />}
          {view === 'take' && <TakeQuizView code={quizCode} onBack={() => navigate('dashboard')} />}
        </div>
      );
    }

    // ==========================================
    // 4. VIEW: TẠO ĐỀ, NHẬP WORD/PDF, GIỮ NGUYÊN ẢNH
    // ==========================================
    function QuizCreatorView({ onBack }) {
      const [title, setTitle] = useState('');
      const [mode, setMode] = useState('exam');
      const [duration, setDuration] = useState(45);
      const [questions, setQuestions] = useState([]);
      const [isProcessingFile, setIsProcessingFile] = useState(false);
      const [statusMsg, setStatusMsg] = useState('');
      const [previewImg, setPreviewImg] = useState(null);
      const [isSaving, setIsSaving] = useState(false);

      const fileInputRef = useRef(null);

      // XỬ LÝ ĐỌC FILE WORD (.DOCX) - BÓC ẢNH VÀ CHỮ
      const processDocx = async (file) => {
        setStatusMsg('Đang giải nén văn bản và trích xuất hình ảnh từ Word...');
        const arrayBuffer = await file.arrayBuffer();

        const options = {
          convertImage: mammoth.images.imgElement((image) => {
            return image.read("base64").then((imageBuffer) => {
              return {
                src: `data:${image.contentType};base64,${imageBuffer}`
              };
            });
          })
        };

        const result = await mammoth.convertToHtml({ arrayBuffer }, options);
        const parsed = parseExamContent(result.value);
        setQuestions(parsed);
        setStatusMsg(`Đã nhận diện thành công ${parsed.length} câu hỏi từ Word!`);
      };

      // XỬ LÝ ĐỌC FILE PDF (TEXT LAYER + EMBEDDED IMAGES + OCR NẾU SCAN)
      const processPdf = async (file) => {
        setStatusMsg('Đang mở luồng dữ liệu PDF...');
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        let fullHtml = '';
        let totalTextLength = 0;

        for (let i = 1; i <= pdf.numPages; i++) {
          setStatusMsg(`Đang đọc trang ${i}/${pdf.numPages}...`);
          const page = await pdf.getPage(i);
          
          // Trích xuất text
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          totalTextLength += pageText.trim().length;

          // Trích xuất ảnh trong PDF
          const operatorList = await page.getOperatorList();
          const imagesInPage = [];

          for (let j = 0; j < operatorList.fnArray.length; j++) {
            if (operatorList.fnArray[j] === pdfjsLib.OPS.paintImageXObject) {
              const objId = operatorList.argsArray[j][0];
              try {
                const imgData = await page.objs.get(objId);
                if (imgData && imgData.data) {
                  // Tạo canvas phụ để chuyển thành DataURL
                  const canvas = document.createElement('canvas');
                  canvas.width = imgData.width;
                  canvas.height = imgData.height;
                  const ctx = canvas.getContext('2d');
                  const imgDataObj = ctx.createImageData(imgData.width, imgData.height);
                  
                  // Chuyển đổi dữ liệu byte RGB/RGBA
                  const d = imgDataObj.data;
                  const src = imgData.data;
                  if (src.length === imgData.width * imgData.height * 3) {
                    let s = 0, t = 0;
                    while (s < src.length) {
                      d[t++] = src[s++];
                      d[t++] = src[s++];
                      d[t++] = src[s++];
                      d[t++] = 255;
                    }
                  } else {
                    d.set(src);
                  }
                  ctx.putImageData(imgDataObj, 0, 0);
                  imagesInPage.push(canvas.toDataURL());
                }
              } catch (e) {
                console.warn('Bỏ qua 1 hình ảnh mã hóa phức tạp:', e);
              }
            }
          }

          fullHtml += `<div>${pageText}</div>`;
          imagesInPage.forEach(src => {
            fullHtml += `<img src="${src}" />`;
          });
        }

        // Nếu PDF Scan (rất ít chữ) -> Kích hoạt OCR Tesseract
        if (totalTextLength < 100) {
          setStatusMsg('Phát hiện PDF dạng SCAN. Đang quét chữ bằng OCR (tiếng Việt)...');
          for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
            setStatusMsg(`OCR Trang ${i}... Quá trình này chạy trực tiếp trên máy của bạn.`);
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;

            const ocrResult = await Tesseract.recognize(canvas, 'vie');
            fullHtml += `<div>${ocrResult.data.text}</div>`;
          }
        }

        const parsed = parseExamContent(fullHtml);
        setQuestions(parsed);
        setStatusMsg(`Đã nhận diện thành công ${parsed.length} câu hỏi từ PDF!`);
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessingFile(true);
        setStatusMsg('Đang tải tệp...');
        if (!title) {
          setTitle(file.name.replace(/\.[^/.]+$/, ""));
        }

        try {
          if (file.name.endsWith('.docx')) {
            await processDocx(file);
          } else if (file.name.endsWith('.pdf')) {
            await processPdf(file);
          } else {
            alert('Vui lòng chọn file Word (.docx) hoặc file PDF!');
          }
        } catch (err) {
          alert('Lỗi xử lý file: ' + err.message);
          setStatusMsg('Đã xảy ra lỗi khi đọc file!');
        } finally {
          setIsProcessingFile(false);
        }
      };

      // Thêm ảnh thủ công cho câu hỏi
      const handleAddImageToQuestion = (qIdx, evt) => {
        const file = evt.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const updated = [...questions];
          updated[qIdx].images.push(e.target.result);
          setQuestions(updated);
        };
        reader.readAsDataURL(file);
      };

      const handleRemoveImage = (qIdx, imgIdx) => {
        const updated = [...questions];
        updated[qIdx].images.splice(imgIdx, 1);
        setQuestions(updated);
      };

      // Lưu đề thi lên Supabase
      const handleSaveExam = async () => {
        if (!title.trim()) return alert('Chưa nhập tên đề thi!');
        if (questions.length === 0) return alert('Đề thi chưa có câu hỏi nào!');

        setIsSaving(true);
        try {
          const code = Math.random().toString(36).substring(2, 8).toUpperCase();
          const { data: qz, error: qzErr } = await supabaseClient
            .from('quizzes')
            .insert({
              title,
              code,
              mode,
              duration_minutes: duration,
              is_active: true
            })
            .select().single();

          if (qzErr) throw qzErr;

          const questionPayload = questions.map((q, idx) => ({
            quiz_id: qz.id,
            part: q.part,
            type: q.type,
            content: q.content,
            images: q.images,
            options: q.options,
            explanation: q.explanation || '',
            order_index: idx + 1
          }));

          const { error: itemsErr } = await supabaseClient.from('questions').insert(questionPayload);
          if (itemsErr) throw itemsErr;

          alert(`Tạo đề thành công! Mã đề của bạn là: ${code}`);
          onBack();
        } catch (err) {
          alert('Lỗi lưu CSDL: ' + err.message);
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 pb-24 space-y-6">
          <div className="flex items-center justify-between border-b pb-4">
            <button onClick={onBack} className="text-slate-600 font-bold text-sm">← Trở về</button>
            <h1 className="text-lg font-black text-slate-800">Soạn Đề & Nhập File Word/PDF</h1>
            <button
              onClick={handleSaveExam}
              disabled={isSaving}
              className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm shadow"
            >
              {isSaving ? 'Đang lưu...' : 'Lưu & Xuất Bản'}
            </button>
          </div>

          {/* Cấu hình cơ bản */}
          <div className="bg-white p-5 rounded-2xl border shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="md:col-span-2">
              <label className="text-xs font-bold text-slate-600 uppercase">Tên đề kiểm tra</label>
              <input
                type="text"
                placeholder="VD: Khảo sát chất lượng Toán - Kèm hình minh họa"
                value={title}
                onChange={e => setTitle(e.target.value)}
                className="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium text-sm"
              />
            </div>
            <div>
              <label className="text-xs font-bold text-slate-600 uppercase">Chế độ làm bài</label>
              <select
                value={mode}
                onChange={e => setMode(e.target.value)}
                className="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-semibold"
              >
                <option value="exam">Kiểm tra tính điểm (Chuẩn)</option>
                <option value="practice">Luyện tập (Chọn lại khi sai)</option>
              </select>
            </div>
          </div>

          {/* Hộp Upload File */}
          <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border-2 border-dashed border-blue-200 p-6 rounded-3xl text-center space-y-3">
            <div className="text-3xl">📑</div>
            <div className="font-bold text-slate-800">Nhập đề từ Word (.docx) hoặc PDF</div>
            <p className="text-xs text-slate-500 max-w-md mx-auto">
              Hệ thống sẽ giữ nguyên hình ảnh, nhận diện công thức, phân loại <b>Phần I (Trắc nghiệm)</b> và <b>Phần II (Đúng/Sai)</b>.
            </p>
            <input
              type="file"
              ref={fileInputRef}
              accept=".docx, .pdf"
              onChange={handleFileUpload}
              className="hidden"
            />
            <button
              onClick={() => fileInputRef.current.click()}
              disabled={isProcessingFile}
              className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow transition"
            >
              {isProcessingFile ? 'Đang trích xuất dữ liệu...' : 'Chọn file Word / PDF'}
            </button>
            {statusMsg && <div className="text-xs font-semibold text-indigo-700 animate-pulse">{statusMsg}</div>}
          </div>

          {/* Danh sách câu hỏi xem trước & chỉnh sửa */}
          {questions.length > 0 && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <h3 className="font-black text-slate-800 uppercase tracking-wide text-sm">
                  Danh sách câu hỏi ({questions.length} câu)
                </h3>
              </div>

              {questions.map((q, qIdx) => (
                <div key={q.id || qIdx} className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                  <div className="flex justify-between items-start gap-2">
                    <div className="flex items-center gap-2">
                      <span className="font-black text-xs px-2.5 py-1 bg-slate-100 text-slate-800 rounded-lg">
                        Câu {qIdx + 1}
                      </span>
                      <select
                        value={q.part}
                        onChange={e => {
                          const updated = [...questions];
                          updated[qIdx].part = e.target.value;
                          updated[qIdx].type = e.target.value === 'part1' ? 'single' : 'multi_tf';
                          setQuestions(updated);
                        }}
                        className="text-xs font-bold p-1 bg-slate-50 border rounded-lg"
                      >
                        <option value="part1">Phần I (Trắc nghiệm A,B,C,D)</option>
                        <option value="part2">Phần II (Đúng / Sai)</option>
                      </select>
                    </div>

                    <label className="text-xs text-blue-600 font-bold cursor-pointer hover:underline">
                      + Thêm ảnh
                      <input type="file" accept="image/*" className="hidden" onChange={e => handleAddImageToQuestion(qIdx, e)} />
                    </label>
                  </div>

                  {/* Nội dung câu hỏi */}
                  <textarea
                    rows={2}
                    value={q.content}
                    onChange={e => {
                      const updated = [...questions];
                      updated[qIdx].content = e.target.value;
                      setQuestions(updated);
                    }}
                    className="w-full text-sm font-semibold p-2 border rounded-xl outline-none focus:ring-1 focus:ring-blue-400"
                  />

                  {/* Hiển thị hình ảnh đính kèm của câu */}
                  {q.images && q.images.length > 0 && (
                    <div className="flex flex-wrap gap-3 p-2 bg-slate-50 rounded-xl border">
                      {q.images.map((imgSrc, imgIdx) => (
                        <div key={imgIdx} className="relative group">
                          <img
                            src={imgSrc}
                            alt="minh-hoa"
                            onClick={() => setPreviewImg(imgSrc)}
                            className="h-28 max-w-xs object-contain rounded-lg border bg-white cursor-pointer img-zoom"
                          />
                          <button
                            onClick={() => handleRemoveImage(qIdx, imgIdx)}
                            className="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow"
                          >
                            ✕
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* PHẦN I: TRẮC NGHIỆM A, B, C, D */}
                  {q.part === 'part1' && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2 pt-1">
                      {q.options.map((opt, optIdx) => (
                        <div
                          key={opt.id || optIdx}
                          onClick={() => {
                            const updated = [...questions];
                            updated[qIdx].options.forEach((o, i) => o.is_correct = (i === optIdx));
                            setQuestions(updated);
                          }}
                          className={`p-3 rounded-xl border text-xs cursor-pointer flex items-center justify-between transition ${
                            opt.is_correct ? 'bg-green-50 border-green-500 text-green-900 font-bold' : 'bg-slate-50 hover:bg-slate-100'
                          }`}
                        >
                          <span><b>{opt.label}.</b> {opt.content}</span>
                          {opt.is_correct && <span className="bg-green-600 text-white px-2 py-0.5 rounded text-[10px]">ĐÚNG</span>}
                        </div>
                      ))}
                    </div>
                  )}

                  {/* PHẦN II: ĐÚNG / SAI (a, b, c, d) */}
                  {q.part === 'part2' && (
                    <div className="space-y-2 pt-1">
                      <div className="text-[11px] font-bold text-slate-500 uppercase">Khẳng định Đúng/Sai theo từng ý:</div>
                      {q.options.map((opt, optIdx) => (
                        <div key={opt.id || optIdx} className="p-2.5 rounded-xl border bg-slate-50 flex items-center justify-between gap-3 text-xs">
                          <div className="flex-1 font-medium">
                            <span className="font-bold uppercase mr-1">{opt.label})</span> {opt.content}
                          </div>
                          <div className="flex gap-1">
                            <button
                              type="button"
                              onClick={() => {
                                const updated = [...questions];
                                updated[qIdx].options[optIdx].is_correct = true;
                                setQuestions(updated);
                              }}
                              className={`px-3 py-1 rounded-lg font-bold ${opt.is_correct === true ? 'bg-green-600 text-white' : 'bg-white border text-slate-600'}`}
                            >
                              Đúng
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                const updated = [...questions];
                                updated[qIdx].options[optIdx].is_correct = false;
                                setQuestions(updated);
                              }}
                              className={`px-3 py-1 rounded-lg font-bold ${opt.is_correct === false ? 'bg-red-600 text-white' : 'bg-white border text-slate-600'}`}
                            >
                              Sai
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Lời giải */}
                  <input
                    type="text"
                    placeholder="Lời giải thích chi tiết cho câu hỏi này..."
                    value={q.explanation || ''}
                    onChange={e => {
                      const updated = [...questions];
                      updated[qIdx].explanation = e.target.value;
                      setQuestions(updated);
                    }}
                    className="w-full text-xs p-2 bg-slate-50 border rounded-lg text-slate-700 outline-none"
                  />
                </div>
              ))}
            </div>
          )}

          {/* Modal Phóng To Ảnh */}
          {previewImg && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={() => setPreviewImg(null)}>
              <div className="relative max-w-3xl max-h-[90vh]">
                <img src={previewImg} alt="zoom" className="max-w-full max-h-[85vh] rounded-2xl object-contain bg-white" />
                <button className="absolute -top-3 -right-3 bg-white text-slate-900 rounded-full w-8 h-8 font-black shadow flex items-center justify-center">✕</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. VIEW: HỌC SINH LÀM BÀI (PHÂN TÁCH PHẦN I & PHẦN II)
    // ==========================================
    function TakeQuizView({ code, onBack }) {
      const [quiz, setQuiz] = useState(null);
      const [questions, setQuestions] = useState([]);
      const [loading, setLoading] = useState(true);

      const [studentName, setStudentName] = useState('');
      const [className, setClassName] = useState('');
      const [hasStarted, setHasStarted] = useState(false);

      // Lưu câu trả lời
      const [part1Answers, setPart1Answers] = useState({}); // { qId: optId }
      const [part2Answers, setPart2Answers] = useState({}); // { qId: { a: true, b: false... } }
      const [practiceFeedback, setPracticeFeedback] = useState({}); // Dành cho luyện tập

      const [timeLeft, setTimeLeft] = useState(0);
      const [submitted, setSubmitted] = useState(false);
      const [finalScore, setFinalScore] = useState(0);
      const [zoomImg, setZoomImg] = useState(null);

      useEffect(() => {
        async function fetchQuizData() {
          setLoading(true);
          const { data: qz } = await supabaseClient.from('quizzes').select('*').eq('code', code).eq('is_active', true).single();
          if (!qz) {
            alert('Đề thi không tồn tại hoặc đã đóng!');
            onBack();
            return;
          }
          setQuiz(qz);
          setTimeLeft(qz.duration_minutes * 60);

          const { data: qs } = await supabaseClient.from('questions').select('*').eq('quiz_id', qz.id).order('order_index');
          if (qs) setQuestions(qs);
          setLoading(false);
        }
        fetchQuizData();
      }, [code]);

      // Đồng hồ đếm ngược
      useEffect(() => {
        if (!hasStarted || submitted || timeLeft <= 0) return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              handleSubmit();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [hasStarted, submitted, timeLeft]);

      // Chọn đáp án Phần I
      const handleSelectPart1 = (qId, opt) => {
        if (submitted) return;
        if (quiz.mode === 'practice') {
          setPracticeFeedback(prev => ({
            ...prev,
            [qId]: { is_correct: opt.is_correct }
          }));
        }
        setPart1Answers(prev => ({ ...prev, [qId]: opt.id }));
      };

      // Chọn đáp án Phần II
      const handleSelectPart2 = (qId, label, val) => {
        if (submitted) return;
        setPart2Answers(prev => ({
          ...prev,
          [qId]: { ...(prev[qId] || {}), [label]: val }
        }));
      };

      // Nộp bài và chấm điểm theo chuẩn 2025
      const handleSubmit = async () => {
        if (submitted) return;

        let part1Score = 0;
        let part2Score = 0;

        const part1Questions = questions.filter(q => q.part === 'part1');
        const part2Questions = questions.filter(q => q.part === 'part2');

        // Chấm Phần I (Mỗi câu đúng được điểm đều)
        part1Questions.forEach(q => {
          const chosenOptId = part1Answers[q.id];
          const correctOpt = q.options.find(o => o.is_correct);
          if (correctOpt && correctOpt.id === chosenOptId) {
            part1Score += 1;
          }
        });

        // Chấm Phần II (Quy tắc Bộ GD: đúng 1 ý: 0.1đ, đúng 2 ý: 0.25đ, đúng 3 ý: 0.5đ, đúng cả 4 ý: 1.0đ)
        part2Questions.forEach(q => {
          const studentAns = part2Answers[q.id] || {};
          let matchCount = 0;
          q.options.forEach(opt => {
            if (studentAns[opt.label] === opt.is_correct) {
              matchCount++;
            }
          });
          if (matchCount === 1) part2Score += 0.1;
          else if (matchCount === 2) part2Score += 0.25;
          else if (matchCount === 3) part2Score += 0.5;
          else if (matchCount === 4) part2Score += 1.0;
        });

        const totalEarned = (part1Questions.length > 0 ? (part1Score / part1Questions.length) * 6 : 0) + 
                            (part2Questions.length > 0 ? (part2Score / part2Questions.length) * 4 : 0);
        
        const normalizedScore = Number(Math.min(10, totalEarned || (part1Score / (questions.length || 1)) * 10).toFixed(2));
        setFinalScore(normalizedScore);

        const spent = (quiz.duration_minutes * 60) - timeLeft;
        await supabaseClient.from('submissions').insert({
          quiz_id: quiz.id,
          student_name: studentName,
          class_name: className,
          score: normalizedScore,
          answers: { part1: part1Answers, part2: part2Answers },
          time_spent_seconds: spent
        });

        setSubmitted(true);
      };

      if (loading) return <div className="text-center py-20 font-bold text-slate-500">Đang tải đề thi...</div>;

      // Màn hình khởi đầu
      if (!hasStarted) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
            <div className="bg-white max-w-sm w-full p-6 rounded-3xl shadow-xl border space-y-4">
              <div className="text-center">
                <span className="text-[10px] font-black uppercase px-2.5 py-1 rounded-full bg-blue-100 text-blue-800">
                  {quiz.mode === 'practice' ? 'Luyện tập tự do' : 'Kiểm tra chính thức'}
                </span>
                <h1 className="text-lg font-black text-slate-800 mt-2">{quiz.title}</h1>
                <p className="text-xs text-slate-500 mt-1">{questions.length} câu | {quiz.duration_minutes} phút</p>
              </div>

              <div className="space-y-3 pt-2">
                <div>
                  <label className="text-xs font-bold text-slate-600">Họ và tên thí sinh *</label>
                  <input
                    type="text"
                    required
                    placeholder="Nguyễn Văn An"
                    value={studentName}
                    onChange={e => setStudentName(e.target.value)}
                    className="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-semibold"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-600">Lớp *</label>
                  <input
                    type="text"
                    required
                    placeholder="12A1"
                    value={className}
                    onChange={e => setClassName(e.target.value)}
                    className="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-semibold"
                  />
                </div>
                <button
                  onClick={() => {
                    if (!studentName.trim() || !className.trim()) return alert('Vui lòng điền họ tên và lớp!');
                    setHasStarted(true);
                  }}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition text-sm"
                >
                  Bắt đầu làm bài
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Màn hình kết quả
      if (submitted) {
        return (
          <div className="min-h-screen bg-slate-50 p-4 flex justify-center items-center">
            <div className="bg-white max-w-md w-full p-6 rounded-3xl shadow border text-center space-y-4">
              <div className="text-5xl">🎯</div>
              <h2 className="text-xl font-black text-slate-800">Hoàn thành bài kiểm tra!</h2>
              <div className="bg-slate-50 p-4 rounded-2xl border flex justify-around">
                <div>
                  <div className="text-xs text-slate-400">Thí sinh</div>
                  <div className="font-bold text-slate-800">{studentName} - {className}</div>
                </div>
                <div>
                  <div className="text-xs text-slate-400">Điểm đạt được</div>
                  <div className="text-3xl font-black text-blue-600">{finalScore} / 10</div>
                </div>
              </div>
              <button onClick={() => window.location.reload()} className="w-full py-2.5 bg-slate-800 text-white font-bold rounded-xl text-xs">
                Làm lại lượt khác
              </button>
            </div>
          </div>
        );
      }

      const p1List = questions.filter(q => q.part === 'part1');
      const p2List = questions.filter(q => q.part === 'part2');

      return (
        <div className="min-h-screen bg-slate-100 pb-28">
          {/* Header nổi */}
          <div className="sticky top-0 z-30 bg-white border-b px-4 py-3 flex justify-between items-center shadow-sm">
            <div>
              <div className="font-black text-slate-800 text-sm">{studentName} ({className})</div>
              <div className="text-[10px] text-slate-400">Đề: {quiz.title}</div>
            </div>
            <div className="flex items-center gap-2">
              <span className="font-mono font-black text-red-600 bg-red-50 px-3 py-1.5 rounded-full text-xs">
                ⏱ {Math.floor(timeLeft / 60)}:{('0' + (timeLeft % 60)).slice(-2)}
              </span>
              <button onClick={handleSubmit} className="bg-blue-600 hover:bg-blue-700 text-white font-black text-xs px-3.5 py-1.5 rounded-xl shadow">
                Nộp bài
              </button>
            </div>
          </div>

          <div className="max-w-3xl mx-auto p-4 space-y-6">
            {/* PHẦN I */}
            {p1List.length > 0 && (
              <div className="space-y-4">
                <div className="bg-blue-600 text-white font-black text-xs px-4 py-2 rounded-xl uppercase tracking-wider shadow">
                  Phần I: Câu hỏi trắc nghiệm nhiều lựa chọn
                </div>
                {p1List.map((q, idx) => (
                  <div key={q.id} className="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
                    <span className="font-black text-xs px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg">
                      Câu {idx + 1}
                    </span>
                    <div className="text-sm font-semibold text-slate-800">{q.content}</div>

                    {/* Ảnh đính kèm */}
                    {q.images && q.images.length > 0 && (
                      <div className="flex flex-wrap gap-2 pt-1">
                        {q.images.map((src, i) => (
                          <img
                            key={i}
                            src={src}
                            alt="minh-hoa"
                            onClick={() => setZoomImg(src)}
                            className="h-32 object-contain rounded-xl border bg-slate-50 cursor-pointer img-zoom"
                          />
                        ))}
                      </div>
                    )}

                    {/* Lựa chọn A, B, C, D */}
                    <div className="space-y-2 pt-1">
                      {q.options.map(opt => {
                        const isChosen = part1Answers[q.id] === opt.id;
                        return (
                          <button
                            key={opt.id}
                            onClick={() => handleSelectPart1(q.id, opt)}
                            className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm flex items-center transition ${
                              isChosen ? 'bg-blue-50 border-blue-600 text-blue-900 font-bold' : 'bg-white hover:bg-slate-50 text-slate-700'
                            }`}
                          >
                            <span className="w-6 h-6 rounded-full border border-current flex items-center justify-center mr-3 font-black text-xs flex-shrink-0">
                              {opt.label}
                            </span>
                            <span className="flex-1">{opt.content}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* PHẦN II */}
            {p2List.length > 0 && (
              <div className="space-y-4 pt-2">
                <div className="bg-indigo-600 text-white font-black text-xs px-4 py-2 rounded-xl uppercase tracking-wider shadow">
                  Phần II: Câu hỏi Đúng / Sai
                </div>
                {p2List.map((q, idx) => (
                  <div key={q.id} className="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
                    <span className="font-black text-xs px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg">
                      Câu {idx + 1}
                    </span>
                    <div className="text-sm font-semibold text-slate-800">{q.content}</div>

                    {q.images && q.images.length > 0 && (
                      <div className="flex flex-wrap gap-2 pt-1">
                        {q.images.map((src, i) => (
                          <img
                            key={i}
                            src={src}
                            alt="minh-hoa"
                            onClick={() => setZoomImg(src)}
                            className="h-32 object-contain rounded-xl border bg-slate-50 cursor-pointer img-zoom"
                          />
                        ))}
                      </div>
                    )}

                    <div className="space-y-2 pt-1">
                      {q.options.map(opt => {
                        const curAns = (part2Answers[q.id] || {})[opt.label];
                        return (
                          <div key={opt.id} className="p-3 rounded-xl border bg-slate-50 flex items-center justify-between gap-3 text-xs">
                            <span className="font-medium flex-1">
                              <b className="uppercase mr-1">{opt.label})</b> {opt.content}
                            </span>
                            <div className="flex gap-1.5">
                              <button
                                onClick={() => handleSelectPart2(q.id, opt.label, true)}
                                className={`px-3 py-1.5 rounded-lg font-black text-xs transition ${
                                  curAns === true ? 'bg-emerald-600 text-white shadow' : 'bg-white border text-slate-700'
                                }`}
                              >
                                Đúng
                              </button>
                              <button
                                onClick={() => handleSelectPart2(q.id, opt.label, false)}
                                className={`px-3 py-1.5 rounded-lg font-black text-xs transition ${
                                  curAns === false ? 'bg-rose-600 text-white shadow' : 'bg-white border text-slate-700'
                                }`}
                              >
                                Sai
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Phóng to ảnh khi làm bài trên điện thoại */}
          {zoomImg && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3" onClick={() => setZoomImg(null)}>
              <img src={zoomImg} alt="zoom" className="max-w-full max-h-[85vh] rounded-2xl object-contain bg-white" />
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. VIEW: DASHBOARD GIÁO VIÊN
    // ==========================================
    function DashboardView({ onCreate, onTake }) {
      const [quizzes, setQuizzes] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        supabaseClient.from('quizzes').select('*').order('created_at', { ascending: false }).then(({ data }) => {
          if (data) setQuizzes(data);
          setLoading(false);
        });
      }, []);

      const copyLink = (code) => {
        const url = `${window.location.origin}${window.location.pathname}?q=${code}`;
        navigator.clipboard.writeText(url);
        alert('Đã sao chép link gửi học sinh: ' + url);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
          <div className="bg-white p-6 rounded-3xl border shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 className="text-xl md:text-2xl font-black text-slate-800">Kho Đề Thi Trực Tuyến</h1>
              <p className="text-xs text-slate-500">Tách riêng Phần I & Phần II - Hỗ trợ nhập Word/PDF giữ ảnh</p>
            </div>
            <button
              onClick={onCreate}
              className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-2xl shadow transition text-sm"
            >
              + Tạo / Nhập Đề Mới
            </button>
          </div>

          {loading ? (
            <div className="text-center py-10 font-bold text-slate-400">Đang tải danh sách đề...</div>
          ) : quizzes.length === 0 ? (
            <div className="text-center py-12 bg-white rounded-3xl border text-slate-500">Chưa có đề nào được tạo.</div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {quizzes.map(qz => (
                <div key={qz.id} className="bg-white p-5 rounded-2xl border shadow-sm flex flex-col justify-between space-y-3">
                  <div>
                    <span className="text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">
                      {qz.mode === 'practice' ? 'Luyện tập' : 'Kiểm tra'}
                    </span>
                    <h3 className="font-bold text-slate-800 text-base mt-2">{qz.title}</h3>
                    <p className="text-xs text-slate-400 mt-0.5">Mã: <b className="text-slate-700 font-mono">{qz.code}</b> | {qz.duration_minutes} phút</p>
                  </div>
                  <div className="flex gap-2 pt-2 border-t">
                    <button onClick={() => copyLink(qz.code)} className="flex-1 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 rounded-xl">
                      📋 Copy Link Gửi HS
                    </button>
                    <button onClick={() => onTake(qz.code)} className="py-2 px-3 text-xs font-bold bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-xl">
                      Làm thử
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
